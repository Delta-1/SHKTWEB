# Roda os testes automaticamente a cada alteração enviada ao GitHub.
#
# Serve como rede de segurança: se alguém mexer numa regra crítica (saldo de
# estoque, saldo fumigado, duplicidade de título financeiro) e quebrar, o
# GitHub avisa antes de a alteração chegar ao sistema em produção.

name: Testes

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Regras de negócio
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shkt
          POSTGRES_PASSWORD: shkt
          POSTGRES_DB: shkt_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://shkt:shkt@127.0.0.1:5432/shkt_erp_test
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Conferir que o sistema sobe
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npm run migrate
          DATABASE_URL="$TEST_DATABASE_URL" npm run seed
          DATABASE_URL="$TEST_DATABASE_URL" PORT=3000 node src/server.js &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000/login > /dev/null; then
              echo "Sistema respondeu na tentativa $i."
              exit 0
            fi
            sleep 1
          done
          echo "O sistema não respondeu em /login."
          exit 1
