<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SHKT">
  <!-- Marca de carimbo: argila sobre papel. Sem degradê, sem brilho —
       a mesma lógica do resto do sistema, que é tinta e régua. -->
  <rect width="64" height="64" rx="5" fill="#b4552f"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="2.5" fill="none"
        stroke="#f6e6dc" stroke-opacity=".42"/>
  <!-- espiga: grãos em duas fileiras, alternados -->
  <g fill="#f6e6dc">
    <rect x="26" y="13" width="5.5" height="8" rx="2.75"/>
    <rect x="32.5" y="13" width="5.5" height="8" rx="2.75"/>
    <rect x="26" y="22.5" width="5.5" height="8" rx="2.75"/>
    <rect x="32.5" y="22.5" width="5.5" height="8" rx="2.75"/>
    <rect x="26" y="32" width="5.5" height="8" rx="2.75"/>
    <rect x="32.5" y="32" width="5.5" height="8" rx="2.75"/>
  </g>
  <!-- colmo e folhas -->
  <path d="M32 40v7" stroke="#f6e6dc" stroke-width="2" stroke-linecap="round"/>
  <path d="M31 43c-4 .4-7-1.4-8.5-4.4 3.6-.8 7 .6 8.5 4.4z" fill="#f6e6dc" fill-opacity=".8"/>
  <path d="M33 43c4 .4 7-1.4 8.5-4.4-3.6-.8-7 .6-8.5 4.4z" fill="#f6e6dc" fill-opacity=".8"/>
  <!-- régua de base, como num carimbo de documento -->
  <path d="M18 52h28" stroke="#f6e6dc" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
</svg>
